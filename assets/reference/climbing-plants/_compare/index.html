<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Climbing plants — chosen refs compare (ivy-mx5.12)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1.25rem;
      background: #1a1a1a;
      color: #e8e8e8;
    }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.25rem; }
    p { margin: 0 0 1.5rem; color: #aaa; font-size: 0.85rem; }
    h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 2rem 0 0.75rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid #333;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #ccc;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.5rem;
    }
    figure { margin: 0; }
    figcaption {
      font-size: 0.7rem;
      text-align: center;
      margin-top: 0.35rem;
      color: #999;
      line-height: 1.2;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #333;
      border-radius: 2px;
      background: #111;
    }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <h1>Climbing plants — chosen references</h1>
  <p>Left → right: English ivy · Grape · Boston ivy · Clematis · Rose · Hops · Wisteria</p>

  <h2>mat_edge</h2>
  <div class="grid">
    <figure><img src="thumb/hedera-helix_mat_edge.jpg" alt="" /><figcaption>English ivy</figcaption></figure>
    <figure><img src="thumb/vitis-vinifera_mat_edge.jpg" alt="" /><figcaption>Grape</figcaption></figure>
    <figure><img src="thumb/parthenocissus_mat_edge.jpg" alt="" /><figcaption>Boston ivy</figcaption></figure>
    <figure><img src="thumb/clematis_mat_edge.jpg" alt="" /><figcaption>Clematis</figcaption></figure>
    <figure><img src="thumb/rosa-climbing_mat_edge.jpg" alt="" /><figcaption>Rose</figcaption></figure>
    <figure><img src="thumb/humulus-lupulus_mat_edge.jpg" alt="" /><figcaption>Hops</figcaption></figure>
    <figure><img src="thumb/wisteria_mat_edge.jpg" alt="" /><figcaption>Wisteria</figcaption></figure>
  </div>

  <h2>leaf_detail</h2>
  <div class="grid">
    <figure><img src="thumb/hedera-helix_leaf_detail.jpg" alt="" /><figcaption>English ivy</figcaption></figure>
    <figure><img src="thumb/vitis-vinifera_leaf_detail.jpg" alt="" /><figcaption>Grape</figcaption></figure>
    <figure><img src="thumb/parthenocissus_leaf_detail.jpg" alt="" /><figcaption>Boston ivy</figcaption></figure>
    <figure><img src="thumb/clematis_leaf_detail.jpg" alt="" /><figcaption>Clematis</figcaption></figure>
    <figure><img src="thumb/rosa-climbing_leaf_detail.jpg" alt="" /><figcaption>Rose</figcaption></figure>
    <figure><img src="thumb/humulus-lupulus_leaf_detail.jpg" alt="" /><figcaption>Hops</figcaption></figure>
    <figure><img src="thumb/wisteria_leaf_detail.jpg" alt="" /><figcaption>Wisteria</figcaption></figure>
  </div>

  <h2>silhouette</h2>
  <div class="grid">
    <figure><img src="thumb/hedera-helix_silhouette.jpg" alt="" /><figcaption>English ivy</figcaption></figure>
    <figure><img src="thumb/vitis-vinifera_silhouette.jpg" alt="" /><figcaption>Grape</figcaption></figure>
    <figure><img src="thumb/parthenocissus_silhouette.jpg" alt="" /><figcaption>Boston ivy</figcaption></figure>
    <figure><img src="thumb/clematis_silhouette.jpg" alt="" /><figcaption>Clematis</figcaption></figure>
    <figure><img src="thumb/rosa-climbing_silhouette.jpg" alt="" /><figcaption>Rose</figcaption></figure>
    <figure><img src="thumb/humulus-lupulus_silhouette.jpg" alt="" /><figcaption>Hops</figcaption></figure>
    <figure><img src="thumb/wisteria_silhouette.jpg" alt="" /><figcaption>Wisteria</figcaption></figure>
  </div>
</body>
</html>
